model:
  name: sentence-transformers/all-mpnet-base-v2
  revision: e8c3b32edf5434bc2275fc9bab85f82640a19130
  normalize: true
  device: cuda
  batch_size: 64
  precision: fp32
  embedding_dtype: float32
  embedding_dim: 768
  registry:
    mpnet:
      name: sentence-transformers/all-mpnet-base-v2
      revision: e8c3b32edf5434bc2275fc9bab85f82640a19130
segmentation:
  engine: wtpsplit
  version: 2.2.1
  model: segment-any-text/sat-12l-sm
  model_revision: d70c72a9331b2d5a9e82baad00c64964a23a09bb
  tokenizer: facebookAI/xlm-roberta-base
  tokenizer_revision: e73636d4f797dec63c3081bb6ed5c7b0bb3f2089
  device: cuda
  half_precision: true
  split_on_input_newlines: true
  preprocessing:
    enabled: true
    list_markers:
    - •
    - ▪
    - ●
    - ◦
    - ·
    - '-'
    - '*'
    - –
    - o
    inline_markers:
    - •
    - ▪
    - ●
    - ◦
    end_punctuation: '.!?;:'
    item_split_after: .!?;
    lead_in_endings:
    - be able to
    - in order to
    - responsible for
    - looking for
    - consist of
    - the opportunity to
    lead_in_max_words: 12
    continuation_words:
    - a
    - an
    - and
    - as
    - at
    - by
    - for
    - from
    - in
    - into
    - of
    - 'on'
    - or
    - the
    - to
    - with
    - via
  cleanup:
    drop_empty: true
    bullet_markers:
    - ·
    - •
    - ▪
    - ●
    - '-'
    - '*'
    - –
    drop_if_ends_with:
    - ':'
    strip_enumerators: true
    drop_without_word: true
    strip_emoji: true
    drop_emoji_fragments: true
    drop_all_caps_headings: true
    drop_short_questions: true
    require_content: true
    drop_single_words: true
    drop_section_headings: true
    section_headings:
    - about (us|the (company|role|job|team))
    - who we are|who you are
    - what (you|we|awaits|do we offer)\b.*
    - why (us|join|work)\b.*
    - your (impact|profile|role|mission|tasks|benefits|team)
    - our (offer|commitment|culture|values|team)
    - job (description|summary|details|title)
    - (role|position) (description|summary)
    - duties|responsibilities|accountabilities
    - requirements|qualifications|benefits|perks|compensation|salary
    - how to apply|application( process)?|apply now|interested\??|next steps?|step \d+
    - contact|location|full time|part time|hybrid|remote
    - learning (objectives?|outcomes?)|objectives?|aims?
    - competenc(e|y|es|ies)|knowledge|skills|prerequisites?|prior knowledge|entry requirements
    - syllabus|description|content|contents|course content
    - assessment|evaluation|grading|teaching (method|methods|form)
    - literature|bibliography|references
    - reason|introduction|general information
