  sha256: 7729813fb61957349913dfdabd7b1db71bec2d3862aa79c5095315e366e58502
  expected_rows: 227
  expected_statements: 150

seed: 42

threshold:
  tau: 0.585

bands:
  - {min: 0.585, max: 1.010, w: 1.00}
  - {min: 0.390, max: 0.585, w: 0.00}
  - {min: -1.000, max: 0.390, w: 0.00}

threshold_validation:
  strata:
    - {h: 1, min: -1.00, max: 0.30, n: 6}
    - {h: 2, min: 0.30, max: 0.39, n: 12}
    - {h: 3, min: 0.39, max: 0.45, n: 18}
    - {h: 4, min: 0.45, max: 0.50, n: 42}
    - {h: 5, min: 0.50, max: 0.55, n: 60}
    - {h: 6, min: 0.55, max: 0.60, n: 60}
    - {h: 7, min: 0.60, max: 0.70, n: 54}
    - {h: 8, min: 0.70, max: 0.80, n: 30}
    - {h: 9, min: 0.80, max: 1.01, n: 18}
  length_groups:
    - {name: "1-3", min_words: 1, max_words: 3}
    - {name: "4-6", min_words: 4, max_words: 6}
    - {name: "7+", min_words: 7}
  limits:
    per_curriculum: 8
    per_job_advertisement: 2
    per_statement: 3
  minimum_length_rule:
    short_words: 2
    compare_from_words: 3
    alpha: 0.05
    test: fisher_one_sided
  annotators: [annotator_1, annotator_2]
  analysis:
    grid: {min: 0.30, max: 0.80, step: 0.005}
    bootstrap: 5000
    confidence: 0.95
    kappa_gate: 0.40
    band_rate: mean_of_sources
    fisher_alpha: 0.05
    weight_step: 0.05

